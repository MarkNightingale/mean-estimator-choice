name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: make test
      - name: Tables match saved results
        run: make check
      - name: Package installs and runs
        run: |
          pip install .
          choose-estimator data/wages_2025.csv

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Whole pipeline in reduced form
        run: |
          set -o pipefail
          make smoke 2>&1 | tee smoke.log
      - name: Show the end of the log on failure
        if: failure()
        run: echo "::error title=make smoke::$(tail -40 smoke.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
