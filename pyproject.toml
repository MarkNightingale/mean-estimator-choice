[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "estimator-choice"
version = "1.1.0"
description = "Выбор оценки типичного уровня при выбросах: правило из двух условий, оценки и характеристики выборки"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
  { name = "Елизавета Юрьевна Шиманская" },
  { name = "Марк Владиславович Соловьев" },
  { name = "Анги Ерастиевич Схведиани" },
]
keywords = ["robust statistics", "estimator selection", "outliers", "median", "Huber estimator"]
dependencies = ["numpy>=2.0", "scipy>=1.11", "pandas>=2.0"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.4", "matplotlib>=3.8", "openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
choose-estimator = "estimator_choice.rule:main"

[project.urls]
Repository = "https://github.com/MarkNightingale/mean-estimator-choice"

[tool.setuptools]
packages = ["estimator_choice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
